name: fly
description: "Fly - Global video and photo social app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_compress: ^1.5.1
  cached_network_image: ^3.4.1
  video_editor: ^3.0.0
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  livekit_client: ^2.8.1
  flutter_webrtc: any
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  flutter_sound: ^9.2.13
  permission_handler: ^11.3.1
  wakelock_plus: ^1.5.2
  camera: ^0.11.0+2
  google_mlkit_face_mesh_detection: ^0.4.2
  google_mlkit_translation: ^0.13.1
  google_mlkit_language_id: ^0.13.0
  firebase_messaging: ^15.2.10
  device_info_plus: ^12.3.0
